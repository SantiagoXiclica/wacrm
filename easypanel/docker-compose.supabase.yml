###############################################################################
# Supabase Self-Hosted Stack for Easypanel
#
# Usage:
#   1. Run: python3 generate_supabase_env.py   (generates .env + credentials.txt)
#   2. Copy .env values into Easypanel env vars
#   3. Deploy this compose file in Easypanel
#
# This file is based on the official supabase/docker setup, adapted for
# Easypanel (single-host, no embedded reverse proxy — Easypanel handles TLS).
###############################################################################

x-postgres: &postgres-env
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}

x-db-env: &db-env
  <<: *postgres-env
  PGDATA: /var/lib/postgresql/data

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL 15
  # ──────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:15.8.1.010
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      <<: *db-env
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
    volumes:
      - supabase-db:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────
  # Kong — API Gateway (routes all /auth, /rest, /realtime, etc.)
  # ──────────────────────────────────────────────────────────────
  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_RESOLVER: 127.0.0.11
      KONG_NGINX_PROXY_PROXY_SET_HEADERS: "off"
      KONG_NGINX_PROXY_PROXY_HOST: $$upstream_host
      KONG_NGINX_PROXY_PROXY_SET_HEADER_X_FORWARDED_HOST: $$http_host
      KONG_LOG_LEVEL: error
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro

  # ──────────────────────────────────────────────────────────────
  # GoTrue — Auth service
  # ──────────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.158.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_SMS_AUTOCONFIRM: ${ENABLE_PHONE_AUTOCONFIRM:-true}
      GOTRUE_SMS_PROVIDER: ${SMS_PROVIDER:-}
      GOTRUE_SMS_TWILIO_ACCOUNT_SID: ${SMS_TWILIO_ACCOUNT_SID:-}
      GOTRUE_SMS_TWILIO_AUTH_TOKEN: ${SMS_TWILIO_AUTH_TOKEN:-}
      GOTRUE_SMS_TWILIO_MESSAGE_SERVICE_SID: ${SMS_TWILIO_MESSAGE_SERVICE_SID:-}
      GOTRUE_SMS_VERIFY_ENABLED: ${ENABLE_PHONE_SIGNUP:-true}
      GOTRUE_EXTERNAL_PHONE_ENABLED: ${ENABLE_PHONE_SIGNUP:-true}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-supabase-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${SMTP_USER:-fake_mail_user}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-fake_mail_password}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-fake_sender}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_JWK: ${JWT_JWKS:-}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: ${ENABLE_ANONYMOUS_USERS:-false}

  # ──────────────────────────────────────────────────────────────
  # PostgREST — RESTful API for Postgres
  # ──────────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_APP_SETTINGS_JWT_IAT: "now"
      PGRST_APP_SETTINGS_JWT_ISS: ${JWT_ISSUER:-supabase-demo}
      PGRST_APP_SETTINGS_JWT_JWK: ${JWT_JWKS:-}

  # ──────────────────────────────────────────────────────────────
  # Realtime — WebSocket connections for Postgres changes
  # ──────────────────────────────────────────────────────────────
  realtime:
    image: supabase/realtime:v2.33.54
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-}
      API_EXTERNAL_PORT: 443
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      ENABLE_TAILWIND: "false"
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      PORT: 4000
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 100
      SECURE_CHANNELS_ENABLED: "true"
      SLOT_NAME: supabase_realtime_rls
      TEMPORAL_SLOT_NAME: supabase_realtime_temp_slot
      MAX_REPLICATION_LAG_MB: 1000

  # ──────────────────────────────────────────────────────────────
  # Storage — File storage on S3/MinIO
  # ──────────────────────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.11.13
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${ANON_KEY:-}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:-}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-}
      PGRST_DB_SCHEMAS: storage,public
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      IS_MULTITENANT: "false"
      REGION: ${REGION:-stub}
      GLOBAL_S3_BUCKET: ${GLOBAL_S3_BUCKET:-stub}
      IS_PRIVATE: "false"
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_TRANSFORMATION_URL: http://imgproxy:8080
    volumes:
      - supabase-storage:/var/lib/storage

  # ──────────────────────────────────────────────────────────────
  # imgproxy — Image transformations
  # ──────────────────────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.20.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_ENABLE_PROGRESSIVE_JPEG: "true"
      IMGPROXY_AUTO_WEBP: "true"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # Studio — Supabase Dashboard UI
  # ──────────────────────────────────────────────────────────────
  studio:
    image: supabase/studio:20250505-86c3f36
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      auth:
        condition: service_started
      storage:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      STUDIO_DEFAULT_ORGANIZATION: ${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}
      STUDIO_DEFAULT_PROJECT: ${STUDIO_DEFAULT_PROJECT:-Default Project}
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:-}

  # ──────────────────────────────────────────────────────────────
  # Postgres Meta — DB introspection for Studio
  # ──────────────────────────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_SSL_MODE: disable
      PG_META_SECRET: ${PG_META_CRYPTO_KEY:-}

  # ──────────────────────────────────────────────────────────────
  # Logflare — Logging (optional but useful)
  # ──────────────────────────────────────────────────────────────
  logflare:
    image: supabase/logflare:v1.12.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4001:4001"
    environment:
      POSTGRES_BACKEND_HOST: db
      POSTGRES_BACKEND_PORT: 5432
      POSTGRES_BACKEND_DB: postgres
      POSTGRES_BACKEND_USER: postgres
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_BACKEND_POOL_SIZE: 20
      LOGFLARE_API_KEY: ${LOGFLARE_PRIVATE_ACCESS_TOKEN:-}
      LOGFLARE_SINGLE_TENANT: "true"
      LOGFLARE_SUPABASE_MODE: "true"
      LOGFLARE_MIN_CLUSTER_SIZE: "1"
      LOGFLARE_EQLITE_URL: http://localhost:4000
      SELF_HOSTED: "true"
      DB_SCHEMA: _logflare

  # ──────────────────────────────────────────────────────────────
  # Inbucket — Fake SMTP server (dev only)
  # ──────────────────────────────────────────────────────────────
  mail:
    image: inbucket/inbucket:3.0.0
    restart: unless-stopped
    ports:
      - "2500:2500"
      - "9001:9000"
    environment:
      INBUCKET_WEB_ADDR: 0.0.0.0:9000
      INBUCKET_SMTP_ADDR: 0.0.0.0:2500
      INBUCKET_STORAGE_TYPE: memory
      INBUCKET_STORAGE_MIMEBUTTON: "false"

volumes:
  supabase-db:
  supabase-storage:
